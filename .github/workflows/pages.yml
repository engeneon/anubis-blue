name: Publish documentation
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'scripts/build_docs_site.py'
      - 'deliverables/complete-playbooks/**'
      - 'tests/fixtures/architecture-scenarios.json'
      - 'ui/assets/anubis-logo.png'
      - 'LICENSE'
      - 'NOTICE'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Build and check internal links
        run: python3 scripts/build_docs_site.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
